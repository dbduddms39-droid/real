<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#344d83"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=20261022-store11"><title>양정원의 iPhone</title>
</head>
<body>
<main class="phone" aria-label="양정원의 iPhone">
<div class="wallpaper" aria-hidden="true"><div class="ribbon ribbon-one"></div><div class="ribbon ribbon-two"></div><div class="ribbon ribbon-three"></div></div>
<header class="status"><span id="status-time"></span><div class="island" aria-hidden="true"><i></i></div><span class="signals" aria-label="통신 상태 시뮬레이션"><span data-symbol="signal"></span><span data-symbol="wifi"></span><span class="battery"><i></i></span></span></header>
<section id="home" class="home" hidden aria-label="홈 화면">
<div class="widgets"><button class="weather widget" data-app="날씨"><span class="weather-place">서울 <span data-symbol="location"></span></span><strong>21°</strong><span class="weather-condition"><span data-symbol="sun"></span> 맑음</span><small>최고:24° 최저:16°</small></button><button class="calendar widget" data-app="캘린더"><small id="widget-day"></small><strong id="widget-date"></strong><span class="widget-birthday">지우 생일<small>9월 7일</small></span></button></div>
<div id="apps" class="apps"></div><div class="home-footer"><button id="search" class="search"><span data-symbol="search"></span>검색</button><div class="page-dots" aria-label="홈 화면 페이지"><button aria-label="홈 화면 1페이지" class="selected" data-page="0"></button><button aria-label="홈 화면 2페이지" data-page="1"></button></div></div><div id="dock" class="dock" aria-label="즐겨찾는 앱"></div>
</section>
<section id="lock" class="lock" aria-label="잠금 화면"><span class="lock-symbol" data-symbol="lock"></span><p id="lock-date"></p><h1 id="lock-time"></h1><div class="lock-bottom"><div class="lock-shortcuts"><button id="flashlight" aria-label="손전등 시뮬레이션" aria-pressed="false" data-symbol="flashlight"></button><button data-app="카메라" aria-label="카메라 열기" data-symbol="camera"></button></div><button id="unlock" class="unlock">위로 쓸어올리거나 눌러서 잠금 해제</button></div></section>
<section id="app" class="app" hidden aria-label="열린 앱"><nav><button id="back"><span data-symbol="back"></span>홈</button><strong id="app-title"></strong><button id="done">완료</button></nav><div id="app-content"></div></section>
<section id="control" class="control" hidden aria-label="제어 센터"><div class="control-top"><button id="close-control" aria-label="제어 센터 닫기" data-symbol="close"></button><span class="control-title">제어 센터</span><button id="lock-button" aria-label="화면 잠그기" data-symbol="power"></button></div><div class="control-layout"><div class="connections glass"><button class="toggle circle-toggle airplane" aria-label="비행기 모드" aria-pressed="false" data-symbol="airplane"></button><button class="toggle circle-toggle airdrop active" aria-label="AirDrop" aria-pressed="true" data-symbol="airdrop"></button><button class="toggle circle-toggle wifi-toggle active" aria-label="Wi-Fi" aria-pressed="true" data-symbol="wifi"></button><div class="connection-mini"><button class="toggle circle-toggle cellular active" aria-label="셀룰러 데이터" aria-pressed="true" data-symbol="cellular"></button><button class="toggle circle-toggle bluetooth active" aria-label="Bluetooth" aria-pressed="true" data-symbol="bluetooth"></button><button class="toggle circle-toggle" aria-label="개인용 핫스팟" aria-pressed="false" data-symbol="link"></button><button class="toggle circle-toggle" aria-label="VPN" aria-pressed="false" data-symbol="globe"></button></div></div><div class="media glass"><button id="media-open" class="album track-art-small" aria-label="음악 앱 열기">OVAN</button><strong id="control-song-title">어떻게 지내</strong><small class="control-song-artist">오반</small><div class="media-buttons"><span data-symbol="previous"></span><button id="media-play" aria-label="음원 파일 연결 후 재생" data-symbol="play"></button><span data-symbol="next"></span></div></div><button class="toggle orientation glass" aria-label="화면 방향 잠금" aria-pressed="false" data-symbol="rotation"></button><button class="mirror glass" id="mirror" aria-label="화면 미러링 안내" data-symbol="mirror"></button><div class="slider-tile glass"><input id="brightness" type="range" aria-label="화면 밝기" min="40" max="100" value="100"><span data-symbol="sun"></span></div><div class="slider-tile glass volume-tile"><input id="volume" type="range" aria-label="음악 음량" min="0" max="100" value="65"><span data-symbol="volume"></span></div><button class="toggle focus glass" aria-label="집중 모드" aria-pressed="false"><span data-symbol="moon"></span><span>집중 모드<small>끔</small></span><span data-symbol="chevron"></span></button><button id="fullscreen" class="fullscreen-control glass"><span data-symbol="expand"></span>전체 화면</button><div class="control-quick"><button class="glass" id="control-torch" aria-label="손전등 시뮬레이션" aria-pressed="false" data-symbol="flashlight"></button><button class="glass" data-app="시계" aria-label="시계 열기" data-symbol="timer"></button><button class="glass" data-app="계산기" aria-label="계산기 열기" data-symbol="calculator"></button><button class="glass" data-app="카메라" aria-label="카메라 열기" data-symbol="camera"></button></div></div><p class="control-note">연결 상태는 화면 내 시뮬레이션입니다.</p></section>
<section id="customize" class="customize" role="dialog" aria-modal="true" aria-labelledby="customize-title" hidden><div class="customize-heading"><h2 id="customize-title">사용자화</h2><button id="close-customize" aria-label="사용자화 닫기" data-symbol="close"></button></div><p>아이콘 크기</p><div class="size-options"><button data-icon-size="small" aria-pressed="true">작게</button><button data-icon-size="large" aria-pressed="false">크게</button></div><p>앱 아이콘 모양</p><div class="appearance-options"><button data-appearance="light" aria-pressed="true"><span class="appearance-preview preview-light"></span>라이트</button><button data-appearance="dark" aria-pressed="false"><span class="appearance-preview preview-dark"></span>다크</button><button data-appearance="clear" aria-pressed="false"><span class="appearance-preview preview-clear"></span>투명</button></div></section>
<button id="control-button" class="control-button" aria-label="제어 센터 열기"></button><nav class="system-navigation" aria-label="휴대폰 화면 탐색"><button id="home-button" class="home-button" aria-label="홈으로 이동 또는 잠금 해제"></button></nav><div id="toast" role="status"></div>
<button id="sound-start" class="sound-start" hidden><strong>소리 켜기 ♪</strong><span>한 번 누르면 음악이 시작돼요</span></button>
<audio id="music-audio" playsinline loop preload="auto" hidden></audio></main><script src="icon-assets.js"></script><script src="icons.js"></script><script src="music-assets.js"></script><script src="photo-assets.js"></script><script src="photos.js"></script><script src="app.js?v=20261022-store12"></script>
</body></html>
